name: CI

on: 
  push: 
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
        node-version: 24

      - run: npm install
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: build-info
          path: public/build-info.json

